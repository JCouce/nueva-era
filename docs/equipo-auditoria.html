<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría de Equipo — Nueva Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  /* Tema único, oscuro a propósito — mismo lenguaje visual que la app que
     esto audita (Nueva Era: Chakra Petch / Rajdhani / Share Tech Mono,
     esquinas cortadas, acento amarillo neón). No es un checklist genérico
     con piel encima: es el mismo terminal, mirando su propio catálogo. */
  :root {
    --night: #0a0a0f;
    --surface: #14141c;
    --elevated: #1e1e2a;
    --line: #2a2a3a;
    --ink: #e6e6f0;
    --ink-dim: #8a8aa0;
    --accent: #fcee0a;   /* implementar-listo / progreso */
    --info: #00f0ff;     /* ya hecho */
    --glitch: #ff2e97;   /* verificar */
    --danger: #ff003c;   /* hallazgo */
    --glow-accent: 0 0 4px #fcee0a99, 0 0 16px #fcee0a4d;
    --glow-info: 0 0 4px #00f0ff99, 0 0 16px #00f0ff4d;
    --font-display: "Chakra Petch", system-ui, sans-serif;
    --font-body: "Rajdhani", system-ui, sans-serif;
    --font-mono: "Share Tech Mono", ui-monospace, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { background: var(--night); }

  body {
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 20px 64px;
    max-width: 720px;
    margin: 0 auto;
  }

  h1, .eyebrow, .verdict, .count {
    font-family: var(--font-display);
    text-wrap: balance;
  }

  /* ── Cabecera + progreso ─────────────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--night) 92%, transparent);
    backdrop-filter: blur(6px);
    padding-block: 14px 12px;
    margin-inline: -16px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--elevated);
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    box-shadow: var(--glow-accent);
    width: 0%;
    transition: width 0.35s ease;
  }
  .count {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--accent);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 10px;
  }
  .search svg { flex-shrink: 0; color: var(--ink-dim); }
  .search input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.95rem;
    outline: none;
  }
  .search input::placeholder { color: var(--ink-dim); }
  .search:focus-within { border-color: var(--accent); }
  .search-clear {
    border: none;
    background: none;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .search-clear:hover { color: var(--ink); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .chip[aria-pressed="true"] {
    color: var(--night);
    background: var(--accent);
    border-color: var(--accent);
  }
  .chip.hide-done[aria-pressed="true"] {
    background: var(--info);
    border-color: var(--info);
  }

  /* ── Hallazgos ────────────────────────────────────────────────────── */
  .hallazgos { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .hallazgos .eyebrow { color: var(--danger); }

  /* ── Secciones / cards ───────────────────────────────────────────── */
  section.categoria { margin-top: 30px; }
  .eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .eyebrow b { color: var(--ink); font-weight: 600; }

  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    transition: opacity 0.2s ease, border-color 0.2s ease;
  }
  .item.verdict-hallazgo { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .item.checked { opacity: 0.5; }

  .box {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    margin: 2px 0 0;
    border: 1.5px solid var(--ink-dim);
    background: var(--night);
    cursor: pointer;
    display: grid;
    place-content: center;
    clip-path: polygon(0 4px, 4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
  }
  .box:checked { background: var(--info); border-color: var(--info); box-shadow: var(--glow-info); }
  .box:checked::after {
    content: "";
    width: 10px;
    height: 6px;
    border-left: 2.5px solid var(--night);
    border-bottom: 2.5px solid var(--night);
    transform: rotate(-45deg) translateY(-1px);
  }
  .box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .item-body { min-width: 0; }
  .item-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .item-title {
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .item.checked .item-title { text-decoration: line-through; text-decoration-color: var(--ink-dim); }

  .verdict {
    font-size: 0.62rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .verdict-implementar { color: var(--info); }
  .verdict-hecho { color: var(--accent); }
  .verdict-ignorar { color: var(--ink-dim); border-style: dashed; }
  .verdict-verificar { color: var(--glitch); }
  .verdict-hallazgo { color: var(--danger); }
  .verdict-fuera { color: var(--ink-dim); }
  .verdict-adhoc { color: #ff8800; }

  .item-detail { margin: 0; font-size: 0.88rem; color: var(--ink-dim); line-height: 1.45; }
  .item-detail code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    color: var(--ink);
    background: var(--elevated);
    padding: 1px 4px;
  }

  footer {
    margin-top: 40px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .no-results {
    margin-top: 30px;
    padding: 20px;
    text-align: center;
    border: 1px dashed var(--line);
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
    .item { transition: none; }
  }
</style>
</head>

</header>

          d: "Fuera de alcance de esta tarea. Son tiradas de uso activo o estados que el jugador se aplica a sí mismo — un tipo de contenido distinto del que la motivó (críticos de arma). Anotado para no perderlo, no para cogerlo aquí." }

  ];

  var VERDICT_LABEL = {
    implementar: "Implementar",
    hecho: "Ya hecho",
    ignorar: "Ignorar",
    verificar: "Verificar",
    hallazgo: "Hallazgo",
    fuera: "Fuera de alcance",
    adhoc: "Ad hoc suelto"
  };

  var app = document.getElementById("app");
  var filtersEl = document.getElementById("filters");
  var searchInput = document.getElementById("search-input");
  var searchClear = document.getElementById("search-clear");
  var activeFilter = "all";
  var hideDone = false;
  var searchQuery = "";
  var checked = {};
  var storageKey = "nueva-era-equipo-checklist";

  function allItems() {
    var out = [];
    DATA.forEach(function (g) { g.items.forEach(function (it) { out.push(it); }); });
    return out;
  }

  // Sin acentos ni mayúsculas, y sin las etiquetas <code> de por medio — así
  // "codigo" encuentra "código" y buscar "estadoId" encuentra el texto
  // aunque vaya envuelto en <code>estadoId</code>.
  function normalizar(s) {
    return s
      .replace(/<[^>]+>/g, " ")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }
  function coincide(it, query) {
    if (!query) return true;
    var haystack = normalizar(it.t + " " + it.d);
    return query.split(/\s+/).filter(Boolean).every(function (palabra) {
      return haystack.indexOf(palabra) !== -1;
    });
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveLocal(state) {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (e) {}
  }

  function render() {
    var total = allItems().length;
    var done = allItems().filter(function (it) { return checked[it.id]; }).length;
    document.getElementById("progress-fill").style.width = (total ? (done / total * 100) : 0) + "%";
    document.getElementById("progress-count").textContent = done + "/" + total;

    app.innerHTML = "";
    var query = normalizar(searchQuery.trim());
    var huboResultados = false;

    DATA.forEach(function (group) {
      var visibleItems = group.items.filter(function (it) {
        if (hideDone && checked[it.id]) return false;
        if (activeFilter !== "all" && it.v !== activeFilter) return false;
        return coincide(it, query);
      });
      if (visibleItems.length === 0) return;
      huboResultados = true;

      var section = document.createElement("section");
      section.className = group.especial ? "hallazgos" : "categoria";

      var eyebrow = document.createElement("div");
      eyebrow.className = "eyebrow";
      var doneInGroup = group.items.filter(function (it) { return checked[it.id]; }).length;
      eyebrow.innerHTML = "<b>" + group.titulo + "</b><span>" + doneInGroup + "/" + group.items.length + "</span>";
      section.appendChild(eyebrow);

      var ul = document.createElement("ul");
      ul.className = "items";

      visibleItems.forEach(function (it) {
        var li = document.createElement("li");
        li.className = "item verdict-" + it.v + (checked[it.id] ? " checked" : "");

        var label = document.createElement("label");
        label.style.display = "contents";

        var box = document.createElement("input");
        box.type = "checkbox";
        box.className = "box";
        box.checked = !!checked[it.id];
        box.setAttribute("aria-label", "Marcar revisado: " + it.t);
        box.addEventListener("change", function () { toggle(it.id, box.checked); });

        var body = document.createElement("div");
        body.className = "item-body";
        body.innerHTML =
          '<div class="item-head"><span class="item-title">' + it.t + '</span>' +
          '<span class="verdict verdict-' + it.v + '">' + VERDICT_LABEL[it.v] + "</span></div>" +
          '<p class="item-detail">' + it.d + "</p>";

        label.appendChild(box);
        label.appendChild(body);
        li.appendChild(label);
        ul.appendChild(li);
      });

      section.appendChild(ul);
      app.appendChild(section);
    });

    if (!huboResultados) {
      var vacio = document.createElement("p");
      vacio.className = "no-results";
      vacio.textContent = "Sin resultados para \"" + searchQuery.trim() + "\".";
      app.appendChild(vacio);
    }

    searchClear.hidden = searchQuery.length === 0;
  }

  function toggle(id, value) {
    checked[id] = value;
    render();
    saveLocal(checked);
  }

  filtersEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var f = btn.getAttribute("data-filter");
    if (f === "hide-done") {
      hideDone = !hideDone;
      btn.setAttribute("aria-pressed", String(hideDone));
    } else {
      activeFilter = f;
      filtersEl.querySelectorAll('.chip:not(.hide-done)').forEach(function (c) {
        c.setAttribute("aria-pressed", String(c === btn));
      });
    }
    render();
  });

  searchInput.addEventListener("input", function () {
    searchQuery = searchInput.value;
    render();
  });
  searchClear.addEventListener("click", function () {
    searchQuery = "";
    searchInput.value = "";
    searchInput.focus();
    render();
  });

  checked = loadLocal();
  render();
})();
</script>
